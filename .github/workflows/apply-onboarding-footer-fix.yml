name: Appliquer le correctif du footer onboarding

on:
  push:
    paths:
      - .github/workflows/apply-onboarding-footer-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-footer-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Ancrer le footer au bas de la modale
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('css/onboarding.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* onboarding-footer-anchor-v4.8 */'
          override = r'''

/* onboarding-footer-anchor-v4.8 */
.modal--onboarding {
  position: fixed !important;
  isolation: isolate;
  overflow: hidden !important;
}

.modal--onboarding #entityForm {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  min-width: 0 !important;
  min-height: 0 !important;
  max-height: none !important;
  margin: 0 !important;
  display: grid !important;
  grid-template-rows: auto minmax(0, 1fr) auto !important;
  overflow: hidden !important;
}

.modal--onboarding #entityForm > .modal__header {
  grid-row: 1;
  min-width: 0;
  min-height: 0;
}

.modal--onboarding #entityForm > .modal__body {
  grid-row: 2;
  width: 100%;
  height: auto !important;
  min-width: 0;
  min-height: 0;
  overflow: hidden !important;
}

.modal--onboarding #entityForm > .modal__footer {
  grid-row: 3;
  position: relative !important;
  inset: auto !important;
  top: auto !important;
  right: auto !important;
  bottom: auto !important;
  left: auto !important;
  align-self: end;
  width: 100%;
  min-width: 0;
  margin: 0 !important;
  z-index: 10;
}

.modal--onboarding .onboarding-layout,
.modal--onboarding .onboarding-content {
  height: 100%;
  min-height: 0;
}
'''
          if marker not in css:
              css_path.write_text(css.rstrip() + override + '\n', encoding='utf-8')

          sw_path = Path('sw.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"a3-pilot-maquette-v\d+\.\d+", "a3-pilot-maquette-v4.8", sw, count=1)
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Publier le correctif
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/onboarding.css sw.js
          if git diff --cached --quiet; then
            echo "Correctif déjà appliqué."
            exit 0
          fi
          git commit -m "Ancrer les boutons onboarding en bas des modales"
          git push origin main
