name: Appliquer la correction vérifiée des rôles

on:
  push:
    paths:
      - payload/manifest.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruire et vérifier l'archive
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part-* > /tmp/a3.zip.b64
          base64 --decode /tmp/a3.zip.b64 > /tmp/a3.zip
          echo "$(cat payload/manifest.txt)  /tmp/a3.zip" | sha256sum --check --status
          mkdir -p /tmp/a3
          unzip -q /tmp/a3.zip -d /tmp/a3
          test -f /tmp/a3/a3-pilot-maquette/index.html
          test -f /tmp/a3/a3-pilot-maquette/chunks/app-07.part
          cat /tmp/a3/a3-pilot-maquette/chunks/app-*.part > /tmp/a3-app.js
          node --check /tmp/a3-app.js

      - name: Appliquer atomiquement la version testée
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/a3/a3-pilot-maquette/ ./

      - name: Publier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Corriger les vues et permissions par rôle'
          git push
